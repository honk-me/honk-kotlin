# Publishes GROUP:POM_ARTIFACT_ID:VERSION_NAME (gradle.properties; app.honk-me:sdk) to Maven
# Central when a tag vX.Y.Z is pushed. The monorepo's sdk-mirror workflow pushes that tag for a
# monorepo tag sdk-kotlin-vX.Y.Z.
#
# Environment "maven-central" secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  Central Portal user token (both halves)
#   SIGNING_KEY                                     ASCII-armored private GPG key
#   SIGNING_PASSWORD                                its passphrase
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      group: ${{ steps.v.outputs.group }}
      artifact: ${{ steps.v.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        name: The tag, VERSION_NAME and CHANGELOG.md agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          actual="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          [ "$actual" = "$v" ] || { echo "::error::gradle.properties has VERSION_NAME=$actual but the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
          {
            echo "version=$v"
            echo "group=$(sed -n 's/^GROUP=//p' gradle.properties)"
            echo "artifact=$(sed -n 's/^POM_ARTIFACT_ID=//p' gradle.properties)"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  maven-central:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/${{ needs.verify.outputs.group }}/${{ needs.verify.outputs.artifact }}/${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=0
          for s in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::secret $s is not set (environment maven-central)"; missing=1; }
          done
          exit "$missing"
      # Uploads to the Central Portal, waits for validation and releases. Signed with the key
      # from the secrets (in memory, never written to disk).
      - name: Publish and release on Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    needs: [verify, maven-central]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GitHub release with the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          COORDINATE: ${{ needs.verify.outputs.group }}:${{ needs.verify.outputs.artifact }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          # shellcheck disable=SC2016 # the backticks are a literal Markdown code fence
          printf '\n```kotlin\nimplementation("%s:%s")\n```\n' "$COORDINATE" "$VERSION" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
